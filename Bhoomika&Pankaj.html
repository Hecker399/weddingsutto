  <style>
    :root {
      --ink: #6a240a;
      --ink-dark: #4a1605;
      --crimson: #8f1812;
      --ruby: #b42a18;
      --gold: #e7b75a;
      --gold-bright: #ffe6a3;
      --gold-deep: #b87c24;
      --parchment-1: #fffdf5;
      --parchment-2: #f9ecd2;
      --parchment-3: #edd5a5;
      --ease: cubic-bezier(.2, .75, .15, 1);
      --ease2: cubic-bezier(.65, 0, .25, 1);
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 45%, #3d180a 0%, #200b04 55%, #110502 100%);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-variant-numeric: lining-nums;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Ambient royal golden aura behind desktop stage */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(231, 183, 90, 0.14), transparent 60%);
    }

    button { font: inherit; color: inherit; }
    a { color: inherit; }
    .dv { font-family: 'Tiro Devanagari Sanskrit', serif; font-style: normal; }

    /* ================= STAGE ================= */
    #stage {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 560px);
      height: 100dvh;
      overflow: hidden;
      background: #2a1005;
      touch-action: pan-y;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(231, 183, 90, 0.25);
    }

    #scene, #fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #scene { z-index: 1; }
    #fx { z-index: 32; pointer-events: none; }

    /* ================= ORNATE PERSISTENT FRAME & GARLANDS ================= */
    #frame {
      position: absolute;
      inset: 7px;
      z-index: 38;
      pointer-events: none;
      border: 1px solid rgba(242, 202, 122, 0.78);
      opacity: 0;
      transition: opacity 1.1s ease;
      box-shadow: 0 0 0 1px rgba(90, 40, 10, 0.35), inset 0 0 18px rgba(231, 183, 90, 0.12);
    }
    #frame::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(242, 202, 122, 0.38);
    }
    #frame svg {
      position: absolute;
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
    }
    #frame .c1 { left: -3px; top: -3px; }
    #frame .c2 { right: -3px; top: -3px; transform: scaleX(-1); }
    #frame .c3 { left: -3px; bottom: -3px; transform: scaleY(-1); }
    #frame .c4 { right: -3px; bottom: -3px; transform: scale(-1); }
    body.started #frame { opacity: 1; }

    #toran {
      position: absolute;
      left: -3%;
      width: 106%;
      top: calc(var(--sat) + 12px);
      z-index: 28;
      transform-origin: 50% 0;
      animation: sway 4.2s ease-in-out infinite alternate;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      filter: drop-shadow(0 6px 10px rgba(35, 10, 2, 0.45));
    }
    #toran svg { width: 100%; height: auto; display: block; }
    @keyframes sway {
      from { transform: rotate(-0.7deg); }
      to { transform: rotate(0.7deg); }
    }

    .mg-corner {
      position: absolute;
      bottom: -6px;
      width: 135px;
      z-index: 26;
      pointer-events: none;
      transition: opacity 0.8s ease;
      filter: drop-shadow(0 -2px 8px rgba(35, 10, 2, 0.5));
    }
    .mg-corner.l { left: -12px; }
    .mg-corner.r { right: -12px; transform: scaleX(-1); }
    .mg-corner svg { width: 100%; height: auto; display: block; }

    #vig {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 85px rgba(35, 10, 2, 0.52);
    }

    /* ================= FOIL SHIMMER TEXT ================= */
    .foilr {
      background: linear-gradient(100deg, #721308 0%, #a82212 28%, #d46b28 46%, #f0b65a 52%, #a82212 72%, #721308 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 5.5s linear infinite;
    }
    .foilg {
      background: linear-gradient(100deg, #c28322 0%, #f5d88c 32%, #fff6d4 50%, #f5d88c 68%, #c28322 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 5.5s linear infinite;
    }
    @keyframes shine {
      from { background-position: 130% 0; }
      to { background-position: -130% 0; }
    }

    /* ================= SLIDES CONTAINER ================= */
    #slides {
      position: absolute;
      inset: 0;
      z-index: 15;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--sat) + 52px) 16px calc(var(--sab) + 74px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.55s ease, visibility 0s 0.55s;
    }
    .slide.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.6s ease, visibility 0s;
    }

    /* ================= ROYAL ARCH PARCHMENT PANEL (Unroll Style) ================= */
    .arch-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 670px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .arch-panel {
      position: relative;
      width: 100%;
      max-height: 100%;
      padding: 28px 22px 24px;
      border-radius: 50% 50% 12px 12px / 11% 11% 12px 12px;
      background:
        radial-gradient(ellipse at 50% 24%, #fffef8 0%, rgba(255, 252, 240, 0) 64%),
        linear-gradient(180deg, var(--parchment-1) 0%, var(--parchment-2) 60%, var(--parchment-3) 100%);
      box-shadow:
        0 18px 46px rgba(25, 6, 1, 0.65),
        inset 0 0 0 1.8px #b9772f,
        inset 0 0 0 5.5px #fdf6e6,
        inset 0 0 0 7px rgba(184, 112, 42, 0.75),
        inset 0 0 0 10px #fdf6e6,
        inset 0 0 0 10.8px rgba(184, 112, 42, 0.35),
        inset 0 0 42px rgba(196, 138, 60, 0.25);
      text-align: center;
      clip-path: inset(0 0 100% 0);
      transform-origin: 50% 0;
      overflow: hidden;
    }
    .slide.active .arch-panel {
      clip-path: inset(0 0 0% 0);
      transition: clip-path 1.15s cubic-bezier(.55, .05, .28, 1);
    }

    /* Bottom wooden-gold roller effect during unroll */
    .arch-roller {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 0;
      height: 14px;
      border-radius: 7px;
      background: linear-gradient(180deg, #6b3a16 0%, #d49a4c 30%, #fff0c2 48%, #a2622a 75%, #4e260b 100%);
      box-shadow: 0 5px 12px rgba(30, 10, 2, 0.55);
      z-index: 6;
      opacity: 0;
      pointer-events: none;
    }
    .slide.active .arch-roller {
      animation: rollDown 1.25s cubic-bezier(.55, .05, .28, 1) forwards;
    }
    @keyframes rollDown {
      0% { transform: translateY(0); opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateY(calc(100% + 520px)); opacity: 0; }
    }

    .arch-panel .wm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 94%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      opacity: 0.08;
      pointer-events: none;
      animation: spinSlow 140s linear infinite;
    }
    @keyframes spinSlow {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .arch-panel .crest {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 72px;
      height: 36px;
      margin-left: -36px;
      pointer-events: none;
    }
    .arch-panel .pco {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
    }
    .arch-panel .pco.c3 { left: 11px; bottom: 11px; transform: scaleY(-1); }
    .arch-panel .pco.c4 { right: 11px; bottom: 11px; transform: scale(-1); }

    .pin {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    /* ================= HANGING SCROLL (Event Cards — Slides 4 & 5) ================= */
    .pcard {
      width: 100%;
      max-width: 425px;
      margin: 0 auto;
      position: relative;
      text-align: center;
      --ph: 340px;
    }
    .pcard .hang {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 0;
      height: 28px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .pcard .hang svg { width: 100%; height: 100%; overflow: visible; }
    .slide.active .pcard .hang { opacity: 1; }

    .pcard .drop {
      transform: translate3d(0, -110%, 0);
      opacity: 0;
      padding-top: 26px;
    }
    .slide.active .pcard .drop {
      animation: dropScroll 1.15s cubic-bezier(.3, 1.32, .5, 1) forwards;
    }
    @keyframes dropScroll {
      0% { transform: translate3d(0, -110%, 0); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: none; opacity: 1; }
    }

    .pcard .swing { transform-origin: 50% 0; }
    .slide.active .pcard .swing {
      animation: swingScroll 2.6s cubic-bezier(.3, 0, .3, 1) 0.8s both;
    }
    @keyframes swingScroll {
      0% { transform: rotate(0); }
      20% { transform: rotate(1.4deg); }
      45% { transform: rotate(-0.85deg); }
      70% { transform: rotate(0.35deg); }
      100% { transform: rotate(0); }
    }

    .rod {
      position: relative;
      height: 15px;
      margin: 0 -10px;
      border-radius: 8px;
      z-index: 4;
      background: linear-gradient(180deg, #6b3a16 0%, #c88a45 28%, #f5d896 46%, #a2622a 72%, #4e260b 100%);
      box-shadow: 0 4px 10px rgba(30, 10, 2, 0.45);
    }
    .rod::before, .rod::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 20px;
      height: 20px;
      margin-top: -10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3c8 0%, #e7b75a 38%, #9a6118 75%, #5c3408 100%);
      box-shadow: 0 2px 5px rgba(30, 10, 2, 0.5);
    }
    .rod::before { left: -10px; }
    .rod::after { right: -10px; }

    .rod.bot {
      transform: translate3d(0, calc(-1 * var(--ph)), 0);
    }
    .slide.active .rod.bot {
      transform: none;
      transition: transform 1.45s cubic-bezier(.55, .05, .3, 1) 0.65s;
    }

    .rod.bot .tas {
      position: absolute;
      left: 50%;
      top: 9px;
      width: 12px;
      margin-left: -6px;
      height: 32px;
      transform-origin: 50% 0;
      animation: tasSway 2.6s ease-in-out infinite alternate;
    }
    .rod.bot .tas::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 0;
      width: 2px;
      height: 12px;
      background: #e7b75a;
    }
    .rod.bot .tas::after {
      content: "";
      position: absolute;
      left: 1px;
      top: 10px;
      width: 10px;
      height: 22px;
      border-radius: 5px 5px 2px 2px;
      background: repeating-linear-gradient(90deg, #b8291c 0 2px, #e66b38 2px 4px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
    }
    @keyframes tasSway {
      from { transform: rotate(-6deg); }
      to { transform: rotate(6deg); }
    }

    .paper {
      position: relative;
      margin: -7px 0;
      padding: 22px 26px 20px;
      clip-path: inset(0 0 100% 0);
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(20, 5, 1, 0.5);
    }
    .slide.active .paper {
      clip-path: inset(0 0 0 0);
      transition: clip-path 1.45s cubic-bezier(.55, .05, .3, 1) 0.65s;
    }
    .day .paper {
      background:
        linear-gradient(90deg, rgba(150, 70, 20, 0.2), rgba(150, 70, 20, 0) 6%, rgba(150, 70, 20, 0) 94%, rgba(150, 70, 20, 0.2)),
        radial-gradient(ellipse at 50% 25%, #fffcf3, #f8ead0 70%, #edd3a6);
      color: #6b3014;
    }
    .night .paper {
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.38), rgba(0, 0, 0, 0) 7%, rgba(0, 0, 0, 0) 93%, rgba(0, 0, 0, 0.38)),
        radial-gradient(ellipse at 50% 25%, #841526, #520a18 68%, #32050d);
      color: #faefd6;
    }
    .paper::before, .paper::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      opacity: 0.9;
      background: repeating-linear-gradient(180deg, #b4301a 0 6px, #e7b75a 6px 8px, #b4301a 8px 14px, transparent 14px 16px);
    }
    .paper::before { left: 7px; }
    .paper::after { right: 7px; }
    .night .paper::before, .night .paper::after {
      background: repeating-linear-gradient(180deg, #e7b75a 0 6px, transparent 6px 8px, #e7b75a 8px 10px, transparent 10px 16px);
      opacity: 0.78;
    }

    .paper .shine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -60%;
      width: 42%;
      transform: skewX(-18deg);

    .pg-om svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pg-om .ring {

    .pg-om .ring2 {

    .slide.active .pg-om .ring { stroke-dashoffset: 0; }

    .pg-om .om {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 40px;

      background: linear-gradient(100deg, #9a3d10 0%, #d9822b 35%, #ffe08a 50%, #d9822b 65%, #9a3d10 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4.5s linear infinite;
      clip-path: circle(0% at 50% 55%);
      transition: clip-path 1.4s var(--ease2) 0.45s;

</head>
<body>
  <!-- Shared Inline SVG Symbols for Ornate Corners, Crests & Icons -->

  <script>
    /* =====================================================================
       UTILITIES & SVG ART GENERATORS
       ===================================================================== */
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rnd = (a, b) => a + Math.random() * (b - a);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const ORD = t => esc(t).replace(/(\d)(st|nd|rd|th)\b/gi, (_, d, o) => `${d}<sup>${o.toLowerCase()}</sup>`);
    const words = (t, cls = '') => esc(t).split(' ').map((w, i) => `<span class="w"><i class="${cls}" style="--i:${i}">${w}</i></span>`).join(' ');

    const ICON_PIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
    const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
    const ICON_TEL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

    const LOTUS_SVG = (d = 0.5, col = '#c0592a') => `
      <svg class="lotus tl" style="--d:${d}s" viewBox="0 0 130 24">
        <g fill="none" stroke="${col}" stroke-width="1">
          <path d="M2 14H44M86 14H128"/>
          <path d="M65 2C60 7 60 14 65 20C70 14 70 7 65 2Z" fill="${col}" fill-opacity=".35"/>
          <path d="M65 20C58 18 53 13 51 7C58 9 63 14 65 20ZM65 20C72 18 77 13 79 7C72 9 67 14 65 20Z" fill="#e7b75a" fill-opacity=".35"/>
          <circle cx="48" cy="14" r="1.6" fill="${col}"/>
          <circle cx="82" cy="14" r="1.6" fill="${col}"/>
        </g>
      </svg>`;

    const ORN_SVG = (col = '#c0592a') => `
      <svg class="pc-orn" viewBox="0 0 120 14">
        <g fill="none" stroke="${col}" stroke-width="1">
          <path d="M4 7H48M72 7H116"/>
          <path d="M60 1L66 7L60 13L54 7Z" fill="${col}" fill-opacity=".35"/>
          <circle cx="52" cy="7" r="1.6" fill="${col}"/>
          <circle cx="68" cy="7" r="1.6" fill="${col}"/>
        </g>
      </svg>`;

    /* Generate Mandala SVG Data URI for Watermark & Canvas */
    const MANDALA_URI = (() => {
      const petal = (r, w, h) => `M${-w / 2} ${-r} Q${-w / 2} ${-r - h * 0.65} 0 ${-r - h} Q${w / 2} ${-r - h * 0.65} ${w / 2} ${-r}`;
      let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400"><g fill="none" stroke="#b44a1e" stroke-width="1.35">';
      [[34, 8, 28], [68, 12, 36], [108, 16, 42], [150, 24, 38]].forEach(([r, n, len]) => {
        s += `<circle r="${r}"/>`;
        for (let i = 0; i < n; i++) s += `<path d="${petal(r, len * 0.48, len)}" transform="rotate(${i * 360 / n})"/>`;
      });
      s += '<circle r="188" stroke-dasharray="3 6"/></g></svg>';
      return 'data:image/svg+xml,' + encodeURIComponent(s);
    })();

    /* Procedural Inline SVG Marigold & Mango-Leaf Toran Garland */
    function buildToranSVG() {
      let garlands = '';
      const arches = 5;
      const W = 560;
      const step = W / arches;
      for (let a = 0; a < arches; a++) {
        const x0 = a * step, x1 = (a + 1) * step, xm = (x0 + x1) / 2;
        garlands += `<path d="M${x0} 8 Q${xm} 46 ${x1} 8" fill="none" stroke="#2d6a2e" stroke-width="3.5"/>`;
        for (let k = 0; k <= 8; k++) {
          const t = k / 8;
          const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * xm + t * t * x1;
          const y = (1 - t) * (1 - t) * 8 + 2 * (1 - t) * t * 46 + t * t * 8;
          if (k % 2 === 1) {
            garlands += `<ellipse cx="${x}" cy="${y + 7}" rx="4.2" ry="9" fill="#2e7d32" stroke="#1b4d1e" stroke-width="0.6" transform="rotate(${(t - 0.5) * 45} ${x} ${y + 7})"/>`;
          }
          const col = k % 2 === 0 ? '#f59e0b' : '#ea580c';
          const hi = k % 2 === 0 ? '#fde047' : '#fb923c';
          garlands += `<circle cx="${x}" cy="${y}" r="6.2" fill="${col}" stroke="#9a3412" stroke-width="0.5"/>`;
          garlands += `<circle cx="${x - 1.2}" cy="${y - 1.2}" r="2.6" fill="${hi}" opacity="0.8"/>`;
        }
        // Hanging marigold tassel at junctions
        if (a > 0) {
          garlands += `
            <line x1="${x0}" y1="12" x2="${x0}" y2="48" stroke="#e7b75a" stroke-width="1.4"/>
            <circle cx="${x0}" cy="24" r="5" fill="#fbbf24"/>
            <circle cx="${x0}" cy="34" r="5.5" fill="#f97316"/>
            <circle cx="${x0}" cy="44" r="4.5" fill="#dc2626"/>
            <path d="M${x0 - 4} 48 L${x0 + 4} 48 L${x0} 62 Z" fill="#b91c1c"/>
          `;
        }
      }
      return `<svg viewBox="0 0 560 66" xmlns="http://www.w3.org/2000/svg">${garlands}</svg>`;
    }

    /* Procedural Corner Marigold Cluster SVG */
    function buildCornerMarigoldSVG() {
      const flowers = [
        [24, 68, 16, '#ea580c', '#fb923c'],
        [48, 76, 14, '#f59e0b', '#fde047'],
        [72, 82, 12, '#ea580c', '#fdba74'],
        [18, 44, 13, '#f59e0b', '#fef08a'],
        [40, 56, 15, '#dc2626', '#f87171'],
        [60, 68, 11, '#fbbf24', '#fef08a'],
        [92, 84, 10, '#f59e0b', '#fde047']
      ];
      let s = '<svg viewBox="0 0 120 95" xmlns="http://www.w3.org/2000/svg">';
      s += '<ellipse cx="34" cy="48" rx="18" ry="8" fill="#2e7d32" transform="rotate(-35 34 48)"/>';
      s += '<ellipse cx="64" cy="70" rx="18" ry="7" fill="#1b5e20" transform="rotate(-15 64 70)"/>';
      flowers.forEach(([x, y, r, c1, c2]) => {
        s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c1}" stroke="#7c2d12" stroke-width="0.6"/>`;
        s += `<circle cx="${x}" cy="${y}" r="${r * 0.65}" fill="${c2}" opacity="0.72" stroke="${c1}" stroke-width="1.2" stroke-dasharray="3 2"/>`;
        s += `<circle cx="${x}" cy="${y}" r="${r * 0.25}" fill="#fffbeb" opacity="0.75"/>`;
      });
      return s + '</svg>';
    }

    /* =====================================================================
       RESPONSIVE AUTO-FIT (Guarantees zero overflow on any screen)
       ===================================================================== */
    function fitAllContent() {
      SLIDES.forEach(sl => {
        const panel = sl.querySelector('.arch-panel');
        if (panel) {
          const pin = panel.querySelector('.pin');
          let f = 1.02;
          pin.style.fontSize = f + 'em';
          const maxH = panel.clientHeight - 44;
          while (pin.scrollHeight > maxH && f > 0.62) {
            f -= 0.03;
            pin.style.fontSize = f.toFixed(2) + 'em';
          }
        }
        const paper = sl.querySelector('.paper');
        if (paper) {
          const inner = paper.querySelector('.pc-in');
          let f = 15.5;
          inner.style.fontSize = f + 'px';
          const maxH = window.innerHeight * 0.56;
          while (paper.scrollHeight > maxH && f > 10.5) {
            f -= 0.5;
            inner.style.fontSize = f + 'px';
          }
          sl.querySelector('.pcard').style.setProperty('--ph', Math.max(200, paper.offsetHeight - 14) + 'px');
        }
      });
    }

    /* =====================================================================
       LIVE COUNTDOWN TIMER
       ===================================================================== */
    const TARGET_TS = new Date(CONFIG.weddingDateISO).getTime();
    let lastSecs = -1;
    function updateCountdown() {
      const diff = Math.max(0, TARGET_TS - Date.now());
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const elD = $('#cdD'), elH = $('#cdH'), elM = $('#cdM'), elS = $('#cdS');
      if (!elD) return;
      elD.textContent = String(d).padStart(2, '0');
      elH.textContent = String(h).padStart(2, '0');
      elM.textContent = String(m).padStart(2, '0');
      if (s !== lastSecs) {
        lastSecs = s;
        elS.textContent = String(s).padStart(2, '0');
        elS.classList.remove('tick');
        void elS.offsetWidth;
        elS.classList.add('tick');
      }
    }
    setInterval(updateCountdown, 500);
    updateCountdown();

    /* =====================================================================
       ICS CALENDAR FILE DOWNLOAD
       ===================================================================== */
    const fmtCal = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    document.addEventListener('click', ev => {
      const a = ev.target.closest('[data-cal]');
      if (!a) return;
      ev.preventDefault();
      ev.stopPropagation();
      const e = CONFIG.events[+a.dataset.cal] || CONFIG.events[1];
      const s = new Date(e.start);
      const en = new Date(s.getTime() + (e.hours || 4) * 3600000);
      const txt = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//BhoomikaPankajRoyalWedding//EN',
        'BEGIN:VEVENT',
        `UID:${Date.now()}@royalwedding`,
        `DTSTAMP:${fmtCal(Date.now())}`,
        `DTSTART:${fmtCal(s)}`,
        `DTEND:${fmtCal(en)}`,
        `SUMMARY:${e.name} · ${CONFIG.brideFirst} & ${CONFIG.groomFirst}`,
        `LOCATION:${e.venue}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');
      const url = URL.createObjectURL(new Blob([txt], { type: 'text/calendar' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = e.name.replace(/\W+/g, '-') + '.ics';
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('Calendar invite downloaded');
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    /* =====================================================================
       WEB AUDIO API — RAJASTHANI ROYAL INSTRUMENTAL (Raag Bhupali / Yaman)
       ===================================================================== */
    const AUD = { ctx: null, muted: false };

function startAudio() {
  if (!AUD.ctx) {
    AUD.ctx = new Audio('https://cdn.jsdelivr.net/gh/Hecker399/weddingsutto@main/song.mp3');
    AUD.ctx.loop = true;
    AUD.ctx.volume = 0.75;
  }
  if (!AUD.muted) {
    AUD.ctx.play().then(() => {
      $('#soundBtn').classList.remove('off');
      showToast('♪ Wedding Song Playing');
    }).catch(() => {});
  }
}

function setMute(m) {
  AUD.muted = m;
  $('#soundBtn').classList.toggle('off', m);
  if (!AUD.ctx) return;
  m ? AUD.ctx.pause() : AUD.ctx.play().catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (!AUD.ctx) return;
  document.hidden ? AUD.ctx.pause() : (!AUD.muted && AUD.ctx.play().catch(() => {}));
});

    /* =====================================================================
       DUAL CANVAS ENGINE: #scene (Rajasthani Backdrops) + #fx (Fireworks Factory)
       ===================================================================== */
    const stage = $('#stage');
    const scv = $('#scene'), sx = scv.getContext('2d', { alpha: false });
    const fcv = $('#fx'), fx = fcv.getContext('2d');

    let W = 390, H = 760, DPR = 1;
    function resizeCanvases() {
      W = stage.clientWidth;
      H = stage.clientHeight;
      DPR = Math.min(2, window.devicePixelRatio || 1);
      [scv, fcv].forEach(cv => {
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
      });
      fitAllContent();
    }

    /* Pre-rendered Glow & Sky Lantern Sprites for ultra-smooth 60fps */
    const SPR = (() => {
      const g = document.createElement('canvas');
      g.width = g.height = 64;
      const gc = g.getContext('2d');
      const rg = gc.createRadialGradient(32, 32, 0, 32, 32, 32);
      rg.addColorStop(0, 'rgba(255, 198, 92, 1)');
      rg.addColorStop(0.4, 'rgba(255, 150, 50, 0.45)');
      rg.addColorStop(1, 'rgba(255, 120, 30, 0)');
      gc.fillStyle = rg;
      gc.fillRect(0, 0, 64, 64);

      const L = document.createElement('canvas');
      L.width = 48; L.height = 58;
      const lc = L.getContext('2d');
      const lg = lc.createLinearGradient(0, 4, 0, 54);
      lg.addColorStop(0, '#ffd466');
      lg.addColorStop(0.65, '#f28729');
      lg.addColorStop(1, '#c93c14');
      lc.fillStyle = lg;
      lc.beginPath();
      lc.moveTo(10, 6);
      lc.lineTo(38, 6);
      lc.quadraticCurveTo(46, 28, 36, 54);
      lc.lineTo(12, 54);
      lc.quadraticCurveTo(2, 28, 10, 6);
      lc.fill();
      return { glow: g, lan: L };
    })();

    /* Background Stars & Lanterns */
    const STARS = Array.from({ length: 75 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.62,
      r: rnd(0.7, 2.0),
      ph: rnd(0, 6.28),
      sp: rnd(1.2, 3.4)
    }));

    let lanterns = [];
    function ensureLanterns(count) {
      while (lanterns.length < count) {
        const z = rnd(0.35, 1);
        lanterns.push({
          x: rnd(W * 0.06, W * 0.94),
          y: rnd(H * 0.25, H + 60),
          z,
          vy: -rnd(14, 28) * z,
          ph: rnd(0, 6.28),
          sw: rnd(8, 18),
          a: 0
        });
      }
    }

    /* Draw Rajasthani Palace Domes Silhouette */
    function drawPalaceSilhouette(c, baseY, color, windowGlow = 0, time = 0) {
      c.save();
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(0, H);
      c.lineTo(0, baseY);
      // Left Chhatri dome
      c.lineTo(W * 0.08, baseY);
      c.lineTo(W * 0.08, baseY - 26);
      c.quadraticCurveTo(W * 0.14, baseY - 58, W * 0.20, baseY - 26);
      c.lineTo(W * 0.20, baseY);
      // Central Grand Palace Dome
      c.lineTo(W * 0.34, baseY);
      c.lineTo(W * 0.34, baseY - 36);
      c.quadraticCurveTo(W * 0.5, baseY - 96, W * 0.66, baseY - 36);
      c.lineTo(W * 0.66, baseY);
      // Right Chhatri dome
      c.lineTo(W * 0.80, baseY);
      c.lineTo(W * 0.80, baseY - 26);
      c.quadraticCurveTo(W * 0.86, baseY - 58, W * 0.92, baseY - 26);
      c.lineTo(W * 0.92, baseY);
      c.lineTo(W, baseY);
      c.lineTo(W, H);
      c.closePath();
      c.fill();

      // Finials (Kalash spires)
      c.strokeStyle = 'rgba(231, 183, 90, 0.5)';
      c.lineWidth = 1.5;
      [[0.14, -44, -60], [0.5, -68, -92], [0.86, -44, -60]].forEach(([xr, y1, y2]) => {
        c.beginPath();
        c.moveTo(W * xr, baseY + y1);
        c.lineTo(W * xr, baseY + y2);
        c.stroke();
      });

      // Glowing arched palace windows
      if (windowGlow > 0.05) {
        c.globalCompositeOperation = 'lighter';
        const wins = [0.14, 0.40, 0.50, 0.60, 0.86];
        wins.forEach((xr, i) => {
          const wx = W * xr;
          const wy = baseY - (xr === 0.5 ? 18 : 12);
          const fl = 0.85 + 0.15 * Math.sin(time * 4 + i);
          c.globalAlpha = windowGlow * 0.8 * fl;
          c.fillStyle = '#ffcf70';
          c.beginPath();
          c.arc(wx, wy, 5, Math.PI, 0);
          c.lineTo(wx + 5, wy + 12);
          c.lineTo(wx - 5, wy + 12);
          c.closePath();
          c.fill();
          c.drawImage(SPR.glow, wx - 22, wy - 18, 44, 44);
        });
      }
      c.restore();
    }

    /* Draw Grand Royal Chandelier (Banquet Scene) */
    function drawChandelier(c, time) {
      c.save();
      const cx = W / 2;
      const topY = 58;
      // Glowing halo
      c.globalCompositeOperation = 'lighter';
      const hg = c.createRadialGradient(cx, topY + 45, 5, cx, topY + 45, 160);
      hg.addColorStop(0, 'rgba(255, 226, 145, 0.55)');
      hg.addColorStop(0.5, 'rgba(231, 165, 60, 0.18)');
      hg.addColorStop(1, 'rgba(231, 165, 60, 0)');
      c.fillStyle = hg;
      c.fillRect(0, 0, W, 240);

      // Crystal tiers
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = 'rgba(255, 226, 150, 0.75)';
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(cx, 0);
      c.lineTo(cx, topY + 12);
      c.stroke();

      [[54, 18], [38, 34], [20, 48]].forEach(([rw, dy], ti) => {
        c.beginPath();
        c.ellipse(cx, topY + dy, rw, 7, 0, 0, Math.PI * 2);
        c.stroke();
        const dots = 9 - ti * 2;
        for (let i = 0; i < dots; i++) {
          const px = cx - rw + (2 * rw * i) / (dots - 1);
          const py = topY + dy + 6;
          const tw = 0.65 + 0.35 * Math.sin(time * 5 + i + ti);
          c.fillStyle = `rgba(255, 245, 200, ${tw})`;
          c.beginPath();
          c.arc(px, py, 2.2, 0, Math.PI * 2);
          c.fill();
        }
      });
      c.restore();
    }

    /* Render Background Scene based on active theme */
    function renderScene(time, dt) {
      sx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const activeEl = SLIDES[currentSlide];
      const theme = started && activeEl ? activeEl.dataset.theme : 'haveli';

      // 1. Base Sky / Courtyard Gradient
      const bg = sx.createLinearGradient(0, 0, 0, H);
      if (theme === 'finale') {
        bg.addColorStop(0, '#070a24');
        bg.addColorStop(0.48, '#171138');
        bg.addColorStop(0.82, '#34131c');
        bg.addColorStop(1, '#240b08');
      } else if (theme === 'twilight') {
        bg.addColorStop(0, '#140b2c');
        bg.addColorStop(0.5, '#3b1024');
        bg.addColorStop(1, '#22080a');
      } else if (theme === 'banquet') {
        bg.addColorStop(0, '#3d100a');
        bg.addColorStop(0.42, '#691d12');
        bg.addColorStop(1, '#290a05');
      } else if (theme === 'sunburst') {
        bg.addColorStop(0, '#78260c');
        bg.addColorStop(0.45, '#c46a1c');
        bg.addColorStop(0.82, '#e69f38');
        bg.addColorStop(1, '#7a310e');
      } else if (theme === 'morning') {
        bg.addColorStop(0, '#8f3914');
        bg.addColorStop(0.45, '#d68934');
        bg.addColorStop(1, '#6b280c');
      } else {
        // Warm Rajasthani Sandstone Haveli
        bg.addColorStop(0, '#591e0b');
        bg.addColorStop(0.38, '#9e4719');
        bg.addColorStop(0.76, '#c47228');
        bg.addColorStop(1, '#521d0a');
      }
      sx.fillStyle = bg;
      sx.fillRect(0, 0, W, H);

      // 2. Rotating Sunrays for Sunburst / Morning / Haveli
      if (theme === 'sunburst' || theme === 'morning' || theme === 'haveli') {
        sx.save();
        sx.translate(W / 2, H * 0.45);
        sx.rotate(time * 0.06);
        sx.globalAlpha = theme === 'sunburst' ? 0.16 : 0.08;
        sx.fillStyle = '#fff3c4';
        const rayCount = 24;
        for (let i = 0; i < rayCount; i++) {
          sx.rotate((Math.PI * 2) / rayCount);
          sx.beginPath();
          sx.moveTo(0, 0);
          sx.lineTo(-18, -H);
          sx.lineTo(18, -H);
          sx.closePath();
          sx.fill();
        }
        sx.restore();
      }

      // 3. Subtle Carved Mughal Arch Framing on Background
      sx.save();
      sx.strokeStyle = 'rgba(255, 220, 145, 0.14)';
      sx.lineWidth = 1.5;
      sx.beginPath();
      sx.moveTo(22, H);
      sx.lineTo(22, 130);
      sx.quadraticCurveTo(22, 42, W / 2, 26);
      sx.quadraticCurveTo(W - 22, 42, W - 22, 130);
      sx.lineTo(W - 22, H);
      sx.stroke();
      sx.restore();

      // 4. Banquet Chandelier
      if (theme === 'banquet') {
        drawChandelier(sx, time);
      }

      // 5. Twinkling Stars for Twilight & Finale
      if (theme === 'finale' || theme === 'twilight') {
        sx.save();
        sx.globalCompositeOperation = 'lighter';
        for (const st of STARS) {
          const a = 0.25 + 0.75 * Math.pow(Math.abs(Math.sin(time * st.sp + st.ph)), 3);
          const x = st.x * W;
          const y = st.y * H;
          sx.globalAlpha = a;
          sx.fillStyle = '#fff7dc';
          sx.beginPath();
          sx.arc(x, y, st.r, 0, Math.PI * 2);
          sx.fill();
          if (a > 0.85) {
            sx.globalAlpha = (a - 0.85) * 4.5;
            sx.fillRect(x - st.r * 4.5, y - 0.5, st.r * 9, 1);
            sx.fillRect(x - 0.5, y - st.r * 4.5, 1, st.r * 9);
          }
        }
        sx.restore();
      }

      // 6. Palace Silhouette at Horizon
      const silCol = (theme === 'finale' || theme === 'twilight') ? 'rgba(18, 6, 14, 0.88)' : 'rgba(62, 18, 6, 0.42)';
      const winGlow = (theme === 'finale' || theme === 'twilight') ? 1 : 0.35;
      drawPalaceSilhouette(sx, H - 56, silCol, winGlow, time);

      // 7. Rising Sky Lanterns on Finale & Twilight
      if (theme === 'finale' || theme === 'twilight') {
        const targetCount = theme === 'finale' ? 24 : 10;
        ensureLanterns(targetCount);
        lanterns.sort((a, b) => a.z - b.z);
        lanterns = lanterns.filter(l => {
          l.y += l.vy * dt;
          l.a = Math.min(1, l.a + dt * 0.9);
          if (l.y < -70) return false;
          const x = l.x + Math.sin(time * 0.65 + l.ph) * l.sw;
          const w = 13 * l.z + 6;
          const h = w * 1.25;
          const fl = 0.86 + 0.14 * Math.sin(time * 9 + l.ph);
          const al = l.a * (0.52 + 0.48 * l.z);
          const rad = w * 3.1;

          sx.globalCompositeOperation = 'lighter';
          sx.globalAlpha = Math.min(1, 0.48 * al * fl);
          sx.drawImage(SPR.glow, x - rad, l.y - rad, rad * 2, rad * 2);

          sx.globalCompositeOperation = 'source-over';
          sx.globalAlpha = al;
          sx.drawImage(SPR.lan, x - w / 2, l.y - h / 2, w, h);

          sx.globalAlpha = Math.min(1, al * fl);
          sx.fillStyle = '#fff9d6';
          sx.beginPath();
          sx.ellipse(x, l.y + h * 0.36, w * 0.18, w * 0.12, 0, 0, Math.PI * 2);
          sx.fill();
          return true;
        });
        sx.globalAlpha = 1;
      } else {
        lanterns.length = 0;
      }
    }

    /* =====================================================================
       60FPS FRAME FIREWORKS FACTORY + MARIGOLD PETALS + GOLDEN STARDUST
       ===================================================================== */
    const FW_PALETTES = [
      ['#ffe6a3', '#ffb703', '#fff8e7'], // Royal Gold & Champagne
      ['#ff9f1c', '#ffbf69', '#ffe8a3'], // Marigold Saffron
      ['#ff4d6d', '#e63946', '#ffd166'], // Royal Crimson & Gold
      ['#2ec4b6', '#80ffdb', '#ffe6a3'], // Emerald & Gold
      ['#fff3b0', '#f4a261', '#ffffff']  // Pure Palace Sparkler
    ];

    let rockets = [];
    let sparks = [];
    let petals = [];
    let motes = [];

    function launchRocket(tx, ty, type = null) {
      const targetX = tx !== undefined ? tx : rnd(W * 0.14, W * 0.86);
      const targetY = ty !== undefined ? ty : rnd(H * 0.12, H * 0.44);
      const startX = lerp(W * 0.5, targetX, 0.65) + rnd(-30, 30);
      const pal = FW_PALETTES[Math.floor(Math.random() * FW_PALETTES.length)];
      const types = ['chrysanthemum', 'willow', 'peony', 'ring'];
      rockets.push({
        x: startX,
        y: H + 10,
        vx: (targetX - startX) * 1.45,
        vy: -Math.sqrt(2 * 340 * (H - targetY)) * 0.96,
        targetY,
        pal,
        type: type || types[Math.floor(Math.random() * types.length)],
        trail: []
      });
    }

    function explodeFirework(x, y, pal, type) {
      const count = type === 'ring' ? 38 : type === 'willow' ? 46 : 56;
      const baseSpeed = type === 'willow' ? rnd(85, 130) : rnd(115, 195);

      for (let i = 0; i < count; i++) {
        const ang = type === 'ring'
          ? (i / count) * Math.PI * 2
          : rnd(0, Math.PI * 2);
        const spd = type === 'ring'
          ? baseSpeed * rnd(0.92, 1.05)
          : baseSpeed * Math.pow(Math.random(), 0.45);

        sparks.push({
          x, y,
          px: x, py: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          decay: type === 'willow' ? rnd(0.45, 0.72) : rnd(0.75, 1.25),
          grav: type === 'willow' ? 145 : 95,
          drag: type === 'willow' ? 0.965 : 0.955,
          col: pal[i % pal.length],
          size: type === 'willow' ? rnd(1.8, 3.0) : rnd(1.6, 3.2),
          twinkle: Math.random() < 0.65,
          crackle: type !== 'ring' && Math.random() < 0.18
        });
      }

      // Inner champagne ring for double-crown royal effect
      if (type === 'ring' || type === 'chrysanthemum') {
        for (let i = 0; i < 18; i++) {
          const ang = (i / 18) * Math.PI * 2;
          const spd = baseSpeed * 0.42;
          sparks.push({
            x, y, px: x, py: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1,
            decay: rnd(1.0, 1.4),
            grav: 70,
            drag: 0.96,
            col: '#fff8e7',
            size: 2.1,
            twinkle: true,
            crackle: false
          });
        }
      }
    }

    function launchSalute(count = 4) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          launchRocket(rnd(W * 0.15, W * 0.85), rnd(H * 0.14, H * 0.42));
        }, i * 240);
      }
    }

    function burstPetals(n = 20) {
      const cols = ['#f59e0b', '#fbbf24', '#ea580c', '#dc2626', '#fde047'];
      for (let i = 0; i < n; i++) {
        petals.push({
          x: rnd(W * 0.1, W * 0.9),
          y: rnd(-20, H * 0.25),
          vx: rnd(-35, 35),
          vy: rnd(45, 110),
          r: rnd(0, 6.28),
          vr: rnd(-3.5, 3.5),
          s: rnd(4.5, 8.5),
          ph: rnd(0, 6.28),
          c: cols[i % cols.length]
        });
      }
    }

    let fwAutoTimer = 0;
    function stepFX(dt, time) {
      fx.setTransform(DPR, 0, 0, DPR, 0, 0);
      fx.clearRect(0, 0, W, H);

      // Ambient Golden Stardust Motes
      if (motes.length < 36 && Math.random() < dt * 10) {
        motes.push({
          x: rnd(0, W),
          y: H + 10,
          vy: -rnd(12, 30),
          r: rnd(1, 2.6),
          ph: rnd(0, 6.28),
          a: rnd(0.25, 0.75)
        });
      }
      fx.save();
      fx.globalCompositeOperation = 'lighter';
      motes = motes.filter(m => {
        m.y += m.vy * dt;
        const x = m.x + Math.sin(time * 1.1 + m.ph) * 14;
        if (m.y < -15) return false;
        fx.globalAlpha = m.a * (0.55 + 0.45 * Math.sin(time * 3 + m.ph));
        fx.fillStyle = '#ffe6a3';
        fx.beginPath();
        fx.arc(x, m.y, m.r, 0, Math.PI * 2);
        fx.fill();
        return true;
      });
      fx.restore();

      // Continuous Fireworks Choreography on Finale (Slide 10) & Twilight (Slide 5)
      if (started) {
        const theme = SLIDES[currentSlide]?.dataset.theme;
        if (theme === 'finale') {
          fwAutoTimer -= dt;
          if (fwAutoTimer <= 0) {
            launchRocket();
            if (Math.random() < 0.42) setTimeout(() => launchRocket(), 260);
            fwAutoTimer = rnd(0.95, 1.75);
          }
        } else if (theme === 'twilight') {
          fwAutoTimer -= dt;
          if (fwAutoTimer <= 0) {
            launchRocket();
            fwAutoTimer = rnd(2.2, 3.6);
          }
        }
      }

      // Gentle Marigold Petal Rain
      if (started && petals.length < 48 && Math.random() < dt * 2.4) {
        const cols = ['#f59e0b', '#fbbf24', '#ea580c', '#dc2626', '#fde047'];
        petals.push({
          x: rnd(0, W),
          y: -15,
          vx: rnd(-18, 18),
          vy: rnd(32, 62),
          r: rnd(0, 6.28),
          vr: rnd(-2.6, 2.6),
          s: rnd(4.2, 7.5),
          ph: rnd(0, 6.28),
          c: cols[Math.floor(Math.random() * cols.length)]
        });
      }

      petals = petals.filter(p => {
        p.vy = Math.min(p.vy + 22 * dt, 85);
        p.x += (p.vx + Math.sin(time * 1.7 + p.ph) * 22) * dt;
        p.y += p.vy * dt;
        p.r += p.vr * dt;
        if (p.y > H + 20) return false;
        fx.save();
        fx.translate(p.x, p.y);
        fx.rotate(p.r);
        fx.scale(1, 0.45 + 0.55 * Math.abs(Math.sin(time * 2.2 + p.ph)));
        fx.fillStyle = p.c;
        fx.globalAlpha = 0.88;
        fx.beginPath();
        fx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, Math.PI * 2);
        fx.fill();
        fx.fillStyle = '#fff';
        fx.globalAlpha = 0.28;
        fx.beginPath();
        fx.ellipse(-p.s * 0.25, -p.s * 0.12, p.s * 0.35, p.s * 0.14, 0, 0, Math.PI * 2);
        fx.fill();
        fx.restore();
        return true;
      });

      // Rockets & Trails
      fx.save();
      fx.globalCompositeOperation = 'lighter';
      rockets = rockets.filter(r => {
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 9) r.trail.shift();
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        r.vy += 340 * dt;

        // Draw glowing golden tail
        for (let i = 1; i < r.trail.length; i++) {
          const p0 = r.trail[i - 1], p1 = r.trail[i];
          fx.strokeStyle = '#ffe39e';
          fx.globalAlpha = (i / r.trail.length) * 0.75;
          fx.lineWidth = (i / r.trail.length) * 2.6;
          fx.beginPath();
          fx.moveTo(p0.x, p0.y);
          fx.lineTo(p1.x, p1.y);
          fx.stroke();
        }
        fx.globalAlpha = 1;
        fx.drawImage(SPR.glow, r.x - 12, r.y - 12, 24, 24);

        if (r.vy >= -25 || r.y <= r.targetY) {
          explodeFirework(r.x, r.y, r.pal, r.type);
          return false;
        }
        return true;
      });

      // Firework Sparks
      const nextSparks = [];
      for (let i = 0; i < sparks.length; i++) {
        const s = sparks[i];
        s.px = s.x;
        s.py = s.y;
        const dragPow = Math.pow(s.drag, dt * 60);
        s.vx *= dragPow;
        s.vy = s.vy * dragPow + s.grav * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.life -= s.decay * dt;

        if (s.life <= 0) {
          if (s.crackle) {
            for (let k = 0; k < 3; k++) {
              const a = rnd(0, 6.28), sp = rnd(25, 55);
              nextSparks.push({
                x: s.x, y: s.y, px: s.x, py: s.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                life: 0.45, decay: 1.5, grav: 60, drag: 0.94,
                col: '#fff8e7', size: 1.5, twinkle: true, crackle: false
              });
            }
          }
          continue;
        }

        const alpha = s.twinkle
          ? s.life * (0.55 + 0.45 * Math.sin(time * 28 + i))
          : s.life;

        fx.strokeStyle = s.col;
        fx.globalAlpha = clamp(alpha);
        fx.lineWidth = s.size * Math.max(0.45, s.life);
        fx.lineCap = 'round';
        fx.beginPath();
        fx.moveTo(s.px, s.py);
        fx.lineTo(s.x, s.y);
        fx.stroke();

        if (s.life > 0.65) {
          fx.globalAlpha = alpha * 0.32;
          fx.drawImage(SPR.glow, s.x - 8, s.y - 8, 16, 16);
        }
        nextSparks.push(s);
      }
      sparks = nextSparks;
      fx.restore();
    }

    /* =====================================================================
       STORY PLAYER, NAVIGATION, SWIPE & INTERACTIVE FIREWORKS
       ===================================================================== */
    let started = false;
    let currentSlide = 0;
    let holdTimer = 0;
    let paused = !CONFIG.autoAdvance;
    let toastTimer = null;

    function showToast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('on'), 2800);
    }

    function setPaused(p) {
      paused = p;
      $('#playBtn').innerHTML = p ? ICON_PLAY : ICON_PAUSE;
    }
    setPaused(paused);

    function goToSlide(index, withFlash = false) {
      index = clamp(index, 0, TOTAL_SLIDES - 1);
      const apply = () => {
        SLIDES.forEach((sl, i) => sl.classList.toggle('active', i === index));
        currentSlide = index;
        holdTimer = 0;

        // Update nav button states
        $('#navPrev').classList.toggle('dis', index === 0);
        $('#navNext').classList.toggle('dis', index === TOTAL_SLIDES - 1);

        // Update progress bars immediately
        BAR_FILLS.forEach((b, i) => {
          b.style.width = i < index ? '100%' : (i === index && CONFIG.slideHolds[i] === 0 ? '100%' : '0%');
        });

        // Celebratory effects on key chapters
        burstPetals(10);
        if (index === 2) launchSalute(2);       // Save the Date
        else if (index === 4) launchSalute(4);  // Shubh Vivah Samaroh
        else if (index === 9) launchSalute(5);  // Grand Finale

        fitAllContent();
      };

      if (withFlash) {
        const fl = $('#flash');
        fl.style.opacity = 0.72;
        setTimeout(() => {
          apply();
          fl.style.opacity = 0;
        }, 180);
      } else {
        apply();
      }
    }

    function nextSlide() {
      if (currentSlide < TOTAL_SLIDES - 1) goToSlide(currentSlide + 1);
    }
    function prevSlide() {
      if (currentSlide > 0) goToSlide(currentSlide - 1, true);
    }

    /* Controls Listeners */
    $('#navNext').onclick = e => { e.stopPropagation(); nextSlide(); };
    $('#navPrev').onclick = e => { e.stopPropagation(); prevSlide(); };
    $('#playBtn').onclick = e => {
      e.stopPropagation();
      setPaused(!paused);
      showToast(paused ? 'Auto-play paused' : 'Auto-play resumed');
    };
    $('#soundBtn').onclick = e => {
      e.stopPropagation();
      if (!AUD.ctx) {
        AUD.muted = false;
        $('#soundBtn').classList.remove('off');
        startAudio();
        return;
      }
      setMute(!AUD.muted);
      showToast(AUD.muted ? 'Music muted' : '♪ Music playing');
    };
    $('#fireBtn').onclick = e => {
      e.stopPropagation();
      launchSalute(5);
      burstPetals(16);
      showToast('✦ Royal Fireworks Salute ✦');
    };

    /* Clickable Progress Bars */
    $('#bars').addEventListener('click', e => {
      const segEl = e.target.closest('[data-jump]');
      if (!segEl) return;
      e.stopPropagation();
      goToSlide(+segEl.dataset.jump, true);
    });

    /* Watch Again button */
    document.addEventListener('click', e => {
      if (e.target.closest('#replayBtn')) {
        e.preventDefault();
        e.stopPropagation();
        setPaused(false);
        goToSlide(0, true);
        launchSalute(4);
      }
    });

    /* Swipe, Tap-to-Firework & Keyboard Controls */
    let sx0 = 0, sy0 = 0, st0 = 0, ptrDown = false;
    stage.addEventListener('pointerdown', e => {
      if (!started) return;
      if (e.target.closest('a,button,#bars')) return;
      ptrDown = true;
      sx0 = e.clientX;
      sy0 = e.clientY;
      st0 = performance.now();
    });

    stage.addEventListener('pointerup', e => {
      if (!ptrDown) return;
      ptrDown = false;
      const dx = e.clientX - sx0;
      const dy = e.clientY - sy0;
      const dt = performance.now() - st0;

      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
        dx < 0 ? nextSlide() : prevSlide();
        return;
      }
      // Tap anywhere on background launches interactive firework burst at tap point
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 450) {
        const rect = stage.getBoundingClientRect();
        const fxX = e.clientX - rect.left;
        const fxY = e.clientY - rect.top;
        const pal = FW_PALETTES[Math.floor(Math.random() * FW_PALETTES.length)];
        explodeFirework(fxX, fxY, pal, Math.random() < 0.5 ? 'chrysanthemum' : 'ring');
      }
    });

    window.addEventListener('keydown', e => {
      if (!started) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    /* =====================================================================
       OPEN INVITATION (Wax Seal Tap) & PRELOADER
       ===================================================================== */
    function openInvite() {
      if (started) return;
      started = true;
      startAudio();
      $('#cover').classList.add('hide');
      document.body.classList.add('started');
      goToSlide(0);
      launchSalute(5);
      burstPetals(24);
      setTimeout(() => { const c = $('#cover'); if (c) c.remove(); }, 1200);
    }

    $('#seal').onclick = e => { e.stopPropagation(); openInvite(); };
    $('#cover').addEventListener('click', openInvite);

    /* Smooth Preloader Ring */
    (function runPreloader() {
      const ldBar = $('#ldBar'), ldPct = $('#ldPct');
      let p = 0;
      const timer = setInterval(() => {
        p = Math.min(1, p + 0.08);
        ldBar.style.strokeDashoffset = (452 * (1 - p)).toFixed(1);
        ldPct.textContent = p < 1 ? `LOADING ${Math.round(p * 100)}%` : 'READY';
        if (p >= 1) {
          clearInterval(timer);
          Promise.resolve(document.fonts ? document.fonts.ready : null).finally(() => {
            resizeCanvases();
            setTimeout(() => $('#loader').classList.add('done'), 260);
          });
        }
      }, 45);
    })();

    /* =====================================================================
       MAIN 60FPS ANIMATION LOOP
       ===================================================================== */
    let lastNow = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastNow) / 1000);
      lastNow = now;
      const time = now / 1000;

      if (started && !paused) {
        const holdDur = CONFIG.slideHolds[currentSlide];
        if (holdDur > 0) {
          holdTimer += dt;
          const frac = clamp(holdTimer / holdDur);
          if (BAR_FILLS[currentSlide]) {
            BAR_FILLS[currentSlide].style.width = (frac * 100).toFixed(2) + '%';
          }
          if (holdTimer >= holdDur) nextSlide();
        }
      }

      renderScene(time, dt);
      stepFX(dt, time);
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
      clearTimeout(window._rzT);
      window._rzT = setTimeout(resizeCanvases, 120);
    });

    resizeCanvases();
    requestAnimationFrame(loop);
  </script>
  <script>
    document.addEventListener('click', () => {
      if (!AUD.muted && (!AUD.ctx || AUD.ctx.paused)) startAudio();
    }, { once: true });
  </script>
</body>
</html>
